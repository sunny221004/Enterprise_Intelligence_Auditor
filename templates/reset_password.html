<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EIA | Reset Password</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>
.auth-alert{color:#ffd2d2;background:rgba(255,70,90,.12);border:1px solid rgba(255,90,110,.3);padding:10px;border-radius:9px;margin:12px 0}.create-account{text-align:center;margin-top:18px}.create-account a{color:#83caff;text-decoration:none;font-weight:600}
</style></head><body class="auth-body"><main class="auth-card"><div class="eia-brand"><img src="{{ url_for('static', filename='eia-logo.png') }}" alt="EIA"></div><span class="eyebrow">SECURE ACCOUNT RECOVERY</span><h1>Set New Password</h1><p class="auth-subtitle">Choose a new password for your EIA account.</p>
{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="auth-alert">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST" class="login-form"><div class="form-group"><label>New Password</label><input type="password" name="password" placeholder="Minimum 8 characters" minlength="8" required></div><div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" placeholder="Enter password again" minlength="8" required></div><button type="submit" class="primary-btn auth-submit">Update Password →</button></form><div class="create-account"><a href="{{ url_for('login') }}">Back to Login</a></div></main></body></html>
