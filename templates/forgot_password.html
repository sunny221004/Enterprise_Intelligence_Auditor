<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIA | Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-links{
            display:flex;
            justify-content:flex-end;
            margin:12px 0
        }
        .auth-links a,.create-account a{
            color:#83caff;
            text-decoration:none;
            font-weight:600
        }
        .reset-note{
            color:#aab8d8;
            font-size:13px;
            line-height:1.6
        }
        .auth-alert{
            color:#ffd2d2;
            background:rgba(255,70,90,.12);
            border:1px solid rgba(255,90,110,.3);
            padding:10px;
            border-radius:9px;
            margin:12px 0
        }
    </style>
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="eia-brand">
            <img src="{{ url_for('static', filename='eia-logo.png') }}" alt="EIA">
        </div>
        <span class="eyebrow">ACCOUNT RECOVERY</span>
        <h1>Forgot Password?</h1>
        <p class="auth-subtitle">Enter your registered email to receive a secure reset link.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="auth-alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

       <form action="{{ url_for('forgot_password') }}"
      method="POST"
      class="login-form">
            <div class="form-group">
                <label>Registered Email</label>
                <input type="email" name="email" placeholder="Enter your registered email" required>
            </div>
            <button type="submit" class="primary-btn auth-submit">Send Reset Link →</button>
        </form>

        <div class="create-account">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </div>

        <p class="reset-note">Reset links expire after 30 minutes.</p>
    </main>
</body>
</html>
